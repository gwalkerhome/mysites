<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>settings | mysites</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 260px;
            background: #020617;
            padding: 20px;
            border-right: 1px solid #1e293b;
        }

        .btn-stage-1 {
            background: #1e293b;
            color: var(--text);
            border: 1px solid #334155;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .btn-stage-1:hover {
            background: var(--accent);
            color: #000;
        }

        #main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .settings-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            border: 1px solid #334155;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #020617;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <h2 style="color: var(--accent);">mysites</h2>
        <button class="btn-stage-1" onclick="location.href='index.html'">Dashboard</button>
        <button class="btn-stage-1" style="background: var(--accent); color: #000;">Settings</button>
    </nav>

    <main id="main-content">
        <h1>App Settings</h1>
        
        <div class="settings-card">
            <div class="form-group">
                <label for="ai-provider">Primary AI Model</label>
                <select id="ai-provider">
                    <option value="gemini-3-flash">Gemini 3 Flash (Default)</option>
                    <option value="gpt-4o">OpenAI GPT-4o</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gemini-key">Gemini API Key</label>
                <input type="password" id="gemini-key" placeholder="Enter your Google AI Key...">
            </div>

            <div class="form-group">
                <label for="openai-key">OpenAI API Key (Optional)</label>
                <input type="password" id="openai-key" placeholder="Enter your OpenAI Key...">
            </div>

            <button class="btn-stage-1" style="width: auto; padding: 12px 40px; background: #22c55e; border: none; color: white;" onclick="saveSettings()">Save Configuration</button>
            
            <div id="status" class="status-msg"></div>
        </div>
    </main>

    <script>
        // Load existing keys on startup
        window.onload = () => {
            document.getElementById('gemini-key').value = localStorage.getItem('gemini_key') || '';
            document.getElementById('openai-key').value = localStorage.getItem('openai_key') || '';
            document.getElementById('ai-provider').value = localStorage.getItem('primary_model') || 'gemini-3-flash';
        };

        function saveSettings() {
            const gKey = document.getElementById('gemini-key').value;
            const oKey = document.getElementById('openai-key').value;
            const model = document.getElementById('ai-provider').value;

            localStorage.setItem('gemini_key', gKey);
            localStorage.setItem('openai_key', oKey);
            localStorage.setItem('primary_model', model);

            const status = document.getElementById('status');
            status.style.display = 'block';
            status.style.backgroundColor = '#064e3b';
            status.innerText = 'Settings saved to local storage!';
            
            setTimeout(() => { status.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
