<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.2.0 | mysites - api settings</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --accent-gemini: #38bdf8;
            --accent-openai: #10a37f;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            padding: 24px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-stage-1 {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: all 0.2s;
            font-size: 0.9rem;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }

        .btn-stage-1:hover { opacity: 0.8; transform: translateX(4px); }

        #main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        #top-header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            background: var(--sidebar-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #split-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .api-panel {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .gemini-panel { border-right: 1px solid var(--border); }

        .panel-title {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .gemini-text { color: var(--accent-gemini); }
        .openai-text { color: var(--accent-openai); }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        input {
            width: 100%;
            padding: 10px;
            background: #020617;
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .list-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .copy-btn {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover { background: var(--text-dim); }

        .model-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .model-table th {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
        }

        .model-table td {
            padding: 8px;
            border-bottom: 1px solid #1e293b;
        }

        .id-code {
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <h2 style="color: var(--accent-gemini);">mysites</h2>
        <a href="index.html" class="btn-stage-1">Dashboard</a>
        <a href="settings.html" class="btn-stage-1">Back to Settings</a>
        <hr style="width: 100%; border: 0; border-top: 1px solid var(--border); margin: 10px 0;">
        <a href="apitest.html" class="btn-stage-1" style="border-color: var(--accent-gemini);">Launch API Test</a>
    </nav>

    <div id="main-wrapper">
        <header id="top-header">
            <h1 style="margin: 0; font-size: 1.5rem;">API Intelligence Center</h1>
        </header>

        <div id="split-container">
            <section class="api-panel gemini-panel">
                <div class="panel-title gemini-text"><span>♊</span> Gemini Flash</div>
                <div class="card">
                    <div class="form-group">
                        <label>Google AI API Key</label>
                        <input type="password" id="gemini-key" placeholder="Paste Gemini key...">
                    </div>
                    <button class="btn-stage-1" style="background: var(--accent-gemini); color: black;" onclick="saveGemini()">Save & Refresh Gemini</button>
                </div>

                <div class="card">
                    <div class="list-controls">
                        <h4 style="margin: 0;">Model Directory</h4>
                        <button class="copy-btn" onclick="copyTable('gemini-list')">Copy All IDs</button>
                    </div>
                    <div id="gemini-list">
                        <p style="color: var(--text-dim); font-size: 0.8rem;">Refresh to load models...</p>
                    </div>
                </div>
            </section>

            <section class="api-panel">
                <div class="panel-title openai-text"><span>✳️</span> OpenAI GPT</div>
                <div class="card">
                    <div class="form-group">
                        <label>OpenAI API Key</label>
                        <input type="password" id="openai-key" placeholder="Paste OpenAI key...">
                    </div>
                    <button class="btn-stage-1" style="background: var(--accent-openai); color: white;" onclick="saveOpenAI()">Save & Refresh OpenAI</button>
                </div>

                <div class="card">
                    <div class="list-controls">
                        <h4 style="margin: 0;">Model Directory</h4>
                        <button class="copy-btn" onclick="copyTable('openai-list')">Copy All IDs</button>
                    </div>
                    <div id="openai-list">
                        <p style="color: var(--text-dim); font-size: 0.8rem;">Refresh to load models...</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        window.onload = () => {
            document.getElementById('gemini-key').value = localStorage.getItem('gemini_key') || '';
            document.getElementById('openai-key').value = localStorage.getItem('openai_key') || '';
            if(localStorage.getItem('gemini_key')) fetchGeminiModels();
            if(localStorage.getItem('openai_key')) fetchOpenAIModels();
        };

        function saveGemini() {
            localStorage.setItem('gemini_key', document.getElementById('gemini-key').value);
            fetchGeminiModels();
        }

        function saveOpenAI() {
            localStorage.setItem('openai_key', document.getElementById('openai-key').value);
            fetchOpenAIModels();
        }

        async function fetchGeminiModels() {
            const key = localStorage.getItem('gemini_key');
            const container = document.getElementById('gemini-list');
            if(!key) return;
            container.innerHTML = "Loading...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();
                let html = `<table class="model-table"><thead><tr><th>Model ID</th><th>Limit</th></tr></thead><tbody>`;
                data.models.forEach(m => {
                    const id = m.name.split('/')[1];
                    html += `<tr><td class="id-code" onclick="copyText('${id}')">${id}</td><td>${Math.round(m.inputTokenLimit/1000)}k</td></tr>`;
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (e) { container.innerHTML = "Error loading models."; }
        }

        async function fetchOpenAIModels() {
            const key = localStorage.getItem('openai_key');
            const container = document.getElementById('openai-list');
            if(!key) return;
            container.innerHTML = "Loading...";
            try {
                const res = await fetch('https://api.openai.com/v1/models', { headers: { 'Authorization': `Bearer ${key}` } });
                const data = await res.json();
                data.data.sort((a, b) => a.id.localeCompare(b.id));
                let html = `<table class="model-table"><thead><tr><th>Model ID</th></tr></thead><tbody>`;
                data.data.forEach(m => {
                    if(m.id.includes('gpt') || m.id.includes('o1') || m.id.includes('o3') || m.id.includes('o4') || m.id.includes('o5')) {
                        html += `<tr><td class="id-code" onclick="copyText('${m.id}')">${m.id}</td></tr>`;
                    }
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (e) { container.innerHTML = "Error loading models."; }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert("Copied: " + text);
        }

        function copyTable(containerId) {
            const ids = Array.from(document.querySelectorAll(`#${containerId} .id-code`)).map(td => td.innerText).join('\n');
            navigator.clipboard.writeText(ids);
            alert("All IDs copied to clipboard.");
        }
    </script>
</body>
</html>
