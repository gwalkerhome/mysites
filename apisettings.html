<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.0.0 | mysites - api test center</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --accent-gemini: #38bdf8;
            --accent-openai: #10a37f;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            padding: 24px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .btn-stage-1 {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .btn-stage-1:hover { opacity: 0.8; transform: translateX(4px); }

        #test-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Header Input Bar */
        #top-bar {
            padding: 20px 40px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 20px;
            align-items: center;
        }

        #test-input {
            flex-grow: 1;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
        }

        /* Split View */
        #split-view {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .test-panel {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .gemini-side { border-right: 1px solid var(--border); }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        .panel-header.gemini { border-color: var(--accent-gemini); color: var(--accent-gemini); }
        .panel-header.openai { border-color: var(--accent-openai); color: var(--accent-openai); }

        .output-box {
            background: #020617;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            min-height: 200px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .status { font-size: 0.8rem; color: var(--text-dim); }
    </style>
</head>
<body>

    <nav id="sidebar">
        <h2 style="color: var(--accent-gemini);">mysites</h2>
        <button class="btn-stage-1" onclick="location.href='index.html'">Dashboard</button>
        <button class="btn-stage-1" onclick="location.href='settings.html'">Settings</button>
    </nav>

    <div id="test-container">
        <div id="top-bar">
            <input type="text" id="test-input" placeholder="Enter a site name (e.g. 'Canva') or URL...">
            <button class="btn-stage-1" style="width: auto; background: var(--accent-gemini); color: black;" onclick="runDualTest()">Run Dual Test</button>
        </div>

        <div id="split-view">
            <div class="test-panel gemini-side">
                <div class="panel-header gemini">
                    <h3>Gemini 3 Flash</h3>
                    <span id="gemini-status" class="status">Idle</span>
                </div>
                <div id="gemini-output" class="output-box">Waiting for input...</div>
            </div>

            <div class="test-panel">
                <div class="panel-header openai">
                    <h3>OpenAI GPT-4o</h3>
                    <span id="openai-status" class="status">Idle</span>
                </div>
                <div id="openai-output" class="output-box">Waiting for input...</div>
            </div>
        </div>
    </div>

    <script>
        async function runDualTest() {
            const input = document.getElementById('test-input').value;
            if (!input) return alert("Please enter a site name or link.");

            const prompt = `Research the following website or name: "${input}". 
            Return a JSON object with: 
            1. official_name
            2. primary_url
            3. short_description (max 20 words)
            4. requires_login (true/false)
            5. is_subscription (true/false)
            6. thumbnail_prompt (a visual description for an image generator)`;

            // Clear previous outputs
            document.getElementById('gemini-output').innerText = "Analyzing...";
            document.getElementById('openai-output').innerText = "Analyzing...";

            // Execute Gemini
            callGemini(prompt);
            
            // Execute OpenAI
            callOpenAI(prompt);
        }

        async function callGemini(prompt) {
            const key = localStorage.getItem('gemini_key');
            const status = document.getElementById('gemini-status');
            const output = document.getElementById('gemini-output');

            if (!key) { output.innerText = "Error: No Gemini Key found in settings."; return; }
            status.innerText = "Processing...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                output.innerText = data.candidates[0].content.parts[0].text;
                status.innerText = "Complete";
            } catch (err) {
                output.innerText = "Error: " + err.message;
                status.innerText = "Failed";
            }
        }

        async function callOpenAI(prompt) {
            const key = localStorage.getItem('openai_key');
            const status = document.getElementById('openai-status');
            const output = document.getElementById('openai-output');

            if (!key) { output.innerText = "Error: No OpenAI Key found in settings."; return; }
            status.innerText = "Processing...";

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{ role: "user", content: prompt }]
                    })
                });
                const data = await response.json();
                output.innerText = data.choices[0].message.content;
                status.innerText = "Complete";
            } catch (err) {
                output.innerText = "Error: " + err.message;
                status.innerText = "Failed";
            }
        }
    </script>
</body>
</html>
