<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.0.0 | mysites - api settings</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 260px;
            background: #020617;
            padding: 24px;
            border-right: 1px solid var(--border);
        }

        .btn-stage-1 {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .btn-stage-1:hover {
            background: var(--accent);
            color: #000;
        }

        #main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .settings-container {
            max-width: 800px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #020617;
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }

        /* Model List Table */
        .model-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .model-table th {
            text-align: left;
            color: var(--accent);
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .model-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            background: var(--border);
            color: var(--text);
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <h2 style="color: var(--accent);">mysites</h2>
        <button class="btn-stage-1" onclick="location.href='index.html'">Dashboard</button>
        <button class="btn-stage-1" onclick="location.href='settings.html'">Back to Settings</button>
    </nav>

    <main id="main-content">
        <h1>API Intelligence Center</h1>
        <p style="color: var(--text-dim);">Configure your AI models and verify connectivity.</p>

        <div class="settings-container">
            <div class="card">
                <h3>Credentials</h3>
                <div class="form-group">
                    <label>Gemini API Key</label>
                    <input type="password" id="gemini-key" placeholder="Paste your Google AI Key...">
                </div>
                <button class="btn-stage-1" style="background: var(--success); border: none; color: white; width: auto;" onclick="saveKeys()">Save & Verify</button>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>Available Gemini Models</h3>
                    <button class="btn-stage-1" style="width: auto; margin: 0; font-size: 0.8rem;" onclick="fetchModels()">Refresh Model List</button>
                </div>
                <div id="model-list-container">
                    <p style="color: var(--text-dim);">Save a key and click refresh to see available models.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        window.onload = () => {
            document.getElementById('gemini-key').value = localStorage.getItem('gemini_key') || '';
            if(localStorage.getItem('gemini_key')) fetchModels();
        };

        function saveKeys() {
            const key = document.getElementById('gemini-key').value;
            localStorage.setItem('gemini_key', key);
            alert("Key saved locally.");
            fetchModels();
        }

        async function fetchModels() {
            const key = localStorage.getItem('gemini_key');
            const container = document.getElementById('model-list-container');
            
            if (!key) {
                container.innerHTML = `<p style="color: #ef4444;">Please provide an API key first.</p>`;
                return;
            }

            container.innerHTML = `<p>Fetching live model data...</p>`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error.message);

                let html = `
                    <table class="model-table">
                        <thead>
                            <tr>
                                <th>Display Name</th>
                                <th>Model ID</th>
                                <th>Input Limit</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.models.forEach(m => {
                    const shortId = m.name.replace('models/', '');
                    html += `
                        <tr>
                            <td style="color: white; font-weight: bold;">${m.displayName}</td>
                            <td><code>${shortId}</code></td>
                            <td>${(m.inputTokenLimit / 1000).toLocaleString()}k</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `<p style="color: #ef4444;">Error: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
