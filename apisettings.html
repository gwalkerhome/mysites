<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.1.0 | mysites - api settings</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --accent-gemini: #38bdf8;
            --accent-openai: #10a37f;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            padding: 24px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .btn-stage-1 {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-stage-1:hover { opacity: 0.8; transform: translateX(4px); }

        #main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        #top-header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            background: var(--sidebar-bg);
        }

        /* Split Screen Layout */
        #split-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .api-panel {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .gemini-panel { border-right: 1px solid var(--border); }

        .panel-title {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .gemini-text { color: var(--accent-gemini); }
        .openai-text { color: var(--accent-openai); }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        input {
            width: 100%;
            padding: 10px;
            background: #020617;
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* Table Styling */
        .model-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .model-table th {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
        }

        .model-table td {
            padding: 8px;
            border-bottom: 1px solid #1e293b;
        }

        .id-code {
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <h2 style="color: var(--accent-gemini);">mysites</h2>
        <button class="btn-stage-1" onclick="location.href='index.html'">Dashboard</button>
        <button class="btn-stage-1" onclick="location.href='settings.html'">Back to Settings</button>
    </nav>

    <div id="main-wrapper">
        <header id="top-header">
            <h1 style="margin: 0; font-size: 1.5rem;">API Intelligence Center</h1>
        </header>

        <div id="split-container">
            <section class="api-panel gemini-panel">
                <div class="panel-title gemini-text">
                    <span>♊</span> Gemini Flash
                </div>
                
                <div class="card">
                    <div class="form-group">
                        <label>Google AI API Key</label>
                        <input type="password" id="gemini-key" placeholder="Paste Gemini key...">
                    </div>
                    <button class="btn-stage-1" style="background: var(--accent-gemini); color: black;" onclick="saveGemini()">Save & Refresh Gemini</button>
                </div>

                <div class="card">
                    <h4 style="margin: 0 0 10px 0;">Available Gemini Models</h4>
                    <div id="gemini-list">
                        <p style="color: var(--text-dim); font-size: 0.8rem;">Refresh to load models...</p>
                    </div>
                </div>
            </section>

            <section class="api-panel">
                <div class="panel-title openai-text">
                    <span>✳️</span> OpenAI GPT
                </div>

                <div class="card">
                    <div class="form-group">
                        <label>OpenAI API Key</label>
                        <input type="password" id="openai-key" placeholder="Paste OpenAI key...">
                    </div>
                    <button class="btn-stage-1" style="background: var(--accent-openai); color: white;" onclick="saveOpenAI()">Save & Refresh OpenAI</button>
                </div>

                <div class="card">
                    <h4 style="margin: 0 0 10px 0;">Available OpenAI Models</h4>
                    <div id="openai-list">
                        <p style="color: var(--text-dim); font-size: 0.8rem;">Refresh to load models...</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        window.onload = () => {
            document.getElementById('gemini-key').value = localStorage.getItem('gemini_key') || '';
            document.getElementById('openai-key').value = localStorage.getItem('openai_key') || '';
            
            if(localStorage.getItem('gemini_key')) fetchGeminiModels();
            if(localStorage.getItem('openai_key')) fetchOpenAIModels();
        };

        function saveGemini() {
            localStorage.setItem('gemini_key', document.getElementById('gemini-key').value);
            fetchGeminiModels();
        }

        function saveOpenAI() {
            localStorage.setItem('openai_key', document.getElementById('openai-key').value);
            fetchOpenAIModels();
        }

        async function fetchGeminiModels() {
            const key = localStorage.getItem('gemini_key');
            const container = document.getElementById('gemini-list');
            if(!key) return;

            container.innerHTML = "Loading...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();
                
                let html = `<table class="model-table"><thead><tr><th>Model ID</th><th>Limit</th></tr></thead><tbody>`;
                data.models.forEach(m => {
                    html += `<tr><td class="id-code">${m.name.split('/')[1]}</td><td>${Math.round(m.inputTokenLimit/1000)}k</td></tr>`;
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (e) { container.innerHTML = "Error loading models."; }
        }

        async function fetchOpenAIModels() {
            const key = localStorage.getItem('openai_key');
            const container = document.getElementById('openai-list');
            if(!key) return;

            container.innerHTML = "Loading...";
            try {
                const res = await fetch('https://api.openai.com/v1/models', {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                const data = await res.json();
                
                // Sort models alphabetically to find GPT ones easier
                data.data.sort((a, b) => a.id.localeCompare(b.id));

                let html = `<table class="model-table"><thead><tr><th>Model ID</th><th>Owner</th></tr></thead><tbody>`;
                data.data.forEach(m => {
                    // Only show common models to avoid a massive list of legacy babbage/davinci stuff
                    if(m.id.includes('gpt') || m.id.includes('o1') || m.id.includes('dall-e')) {
                        html += `<tr><td class="id-code">${m.id}</td><td>${m.owned_by}</td></tr>`;
                    }
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (e) { container.innerHTML = "Error loading models."; }
        }
    </script>
</body>
</html>
