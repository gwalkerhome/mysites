<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="icon.png">
    <title>v1.9.8 | mysites - external link fix</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #020617;
            --surface: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --danger: #f87171;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --sidebar-w: 70px;
            --top-h: 70px;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text); display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        #sidebar { width: var(--sidebar-w); background: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px solid var(--border); flex-shrink: 0; }
        .nav-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 12px; cursor: pointer; text-decoration: none; background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); font-size: 1.2rem; transition: 0.2s; position: relative; }
        .nav-icon:hover, .nav-icon.active { background: var(--accent); color: #000; }
        
        .nav-icon[data-tooltip]:hover::after { content: attr(data-tooltip); position: absolute; left: 100%; margin-left: 10px; background: var(--card-bg); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; white-space: nowrap; border: 1px solid var(--border); z-index: 100; }

        #viewport { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        #top-bar { height: var(--top-h); padding: 0 30px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg-color); flex-shrink: 0; }
        .search-box { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 10px 15px; border-radius: 8px; color: white; outline: none; height: 42px; }

        #main-content { flex-grow: 1; overflow-y: auto; padding: 30px; }
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; margin-bottom: 20px; }

        #featured-portal { min-height: 250px; border-radius: 24px; border: 1px solid var(--border); background: linear-gradient(rgba(15,23,42,0.7), rgba(15,23,42,0.95)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=1500'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        .drop-bar { margin-top: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; display: flex; gap: 10px; }
        .drop-bar input { background: transparent; border: none; color: white; flex: 1; outline: none; }

        #filter-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .filter-chip { padding: 6px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 0.75rem; color: var(--text-dim); cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .filter-chip.active { background: var(--accent); color: black; border-color: var(--accent); font-weight: bold; }

        #vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding-bottom: 80px; }
        .site-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); height: 320px; transition: 0.3s; position: relative; }
        .site-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .site-card:hover .card-actions { opacity: 1; }
        
        .card-thumb { height: 140px; background-size: cover; background-position: center; background-color: #020617; position: relative; }
        .card-content { padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .card-title { font-weight: 700; color: white; text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .tag-pill { background: rgba(56, 189, 248, 0.1); color: var(--accent); font-size: 0.6rem; padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.2); font-weight: bold; text-transform: uppercase; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }

        .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; opacity: 0; transition: 0.2s; z-index: 10; }
        .action-btn { width: 30px; height: 30px; background: rgba(0,0,0,0.8); border: 1px solid var(--border); color: white; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .action-btn:hover { background: var(--accent); color: black; }

        .tag-picker { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; padding: 10px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border); max-height: 100px; overflow-y: auto; }
        .selectable-tag { padding: 4px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); font-size: 0.7rem; cursor: pointer; color: var(--text-dim); }
        .selectable-tag.selected { background: var(--accent); color: black; border-color: var(--accent); }

        #user-badge { position: absolute; bottom: 15px; left: 15px; background: var(--surface); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; font-size: 0.65rem; color: var(--text-dim); display: flex; align-items: center; gap: 6px; pointer-events: none; z-index: 5; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
        .status-dot.online { background: #10b981; box-shadow: 0 0 5px #10b981; }

        #edit-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--surface); width: 100%; max-width: 500px; border-radius: 20px; padding: 30px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .modal-field { margin-bottom: 15px; }
        .modal-field label { display: block; font-size: 0.75rem; color: var(--accent); margin-bottom: 5px; font-weight: bold; }
        .modal-field input, .modal-field textarea { width: 100%; padding: 12px; border-radius: 8px; background: var(--bg-color); border: 1px solid var(--border); color: white; outline: none; }
        
        .upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
        .upload-zone:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }

        .btn-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: white; transition: 0.2s; }
        .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div style="color:var(--accent); font-weight:900; margin-bottom:20px; font-size:1.2rem;">MS</div>
        <a href="index.html" class="nav-icon active" data-tooltip="Home">⌂</a>
        <div onclick="setFilter('dev')" class="nav-icon" data-tooltip="Dev" style="color:#f472b6;">💻</div>
        <div onclick="setFilter('ai')" class="nav-icon" data-tooltip="AI" style="color:#fbbf24;">⚡</div>
        <div onclick="setFilter('work')" class="nav-icon" data-tooltip="Work" style="color:#34d399;">💼</div>
        <div onclick="setFilter('media')" class="nav-icon" data-tooltip="Media" style="color:#a78bfa;">🎬</div>
        <a href="apisettings.html" class="nav-icon" data-tooltip="Settings" style="margin-top:auto;">⚙</a>
        <button class="nav-icon" onclick="handleAuthClick()" id="auth-btn" data-tooltip="Account">⊕</button>
        <button class="nav-icon" onclick="location.reload()" data-tooltip="Reload">↻</button>
    </nav>

    <div id="viewport">
        <header id="top-bar">
            <form action="https://www.google.com/search" method="GET" style="flex:1; display:flex;">
                <input type="text" name="q" class="search-box" placeholder="Google Search...">
            </form>
            <input type="text" id="gemini-chat" class="search-box" style="border-color: var(--accent); flex: 1;" placeholder="Ask Gemini...">
        </header>

        <main id="main-content">
            <div class="dashboard-grid">
                <section id="featured-portal">
                    <h2 id="hero-title" style="margin:0; font-size: 2.2rem;">Vault</h2>
                    <p id="hero-desc" style="color:var(--text-dim); margin:10px 0 20px 0;">Intelligence-driven site archive.</p>
                    <div class="drop-bar">
                        <input type="text" id="site-input" placeholder="Paste URL here...">
                        <button onclick="handleInput()" id="add-btn" style="background:var(--accent); border:none; padding:0 20px; border-radius:8px; cursor:pointer; font-weight:bold; height: 42px;">Save</button>
                        <button onclick="openManualAdd()" class="btn-icon" title="Manual Add">⊕</button>
                    </div>
                </section>
                <div class="widget">
                    <div style="font-size:0.7rem; color:var(--accent); font-weight:bold; margin-bottom:8px;">SCRATCHPAD</div>
                    <textarea id="scratchpad" style="width:100%; height:120px; background:transparent; border:none; color:white; resize:none; outline:none; font-size:0.85rem;" placeholder="Draft thoughts..."></textarea>
                </div>
            </div>

            <div id="filter-bar"></div>
            <div id="status-msg" style="color:var(--accent); font-size:0.8rem; margin-bottom:15px; font-weight:bold; min-height: 1.2rem;"></div>
            <div id="vault-grid"></div>
        </main>

        <div id="user-badge">
            <div class="status-dot" id="status-dot"></div>
            <span id="user-display">Logged Out</span>
        </div>
    </div>

    <div id="edit-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0; font-size:1.2rem; color:white; margin-bottom:20px;">Refine Entry</h2>
            
            <div class="modal-field">
                <label>Update Thumbnail</label>
                <div class="upload-zone" onclick="document.getElementById('file-input').click()">
                    <span id="file-status" style="font-size:0.8rem; color:var(--text-dim);">Click to upload new image</span>
                    <input type="file" id="file-input" hidden accept="image/*" onchange="handleFileSelect(this)">
                </div>
            </div>

            <div class="modal-field"><label>Name</label><input type="text" id="edit-name"></div>
            <div class="modal-field"><label>Link</label><input type="text" id="edit-url"></div>
            <div class="modal-field">
                <label>Tags</label>
                <input type="text" id="edit-tags" placeholder="Add custom tag...">
                <div class="tag-picker" id="tag-picker"></div>
            </div>
            <div class="modal-field"><label>Notes</label><textarea id="edit-desc" rows="2"></textarea></div>
            
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button id="modal-save-btn" onclick="saveChanges()" style="flex:1; background:var(--accent); border:none; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold;">Update</button>
                <button onclick="closeModal()" style="flex:1; background:transparent; border:1px solid var(--border); color:white; padding:12px; border-radius:8px; cursor:pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjdXXUzFOsf5wKDJVGt7TQzHNFj2bEkVY",
            authDomain: "complaint-bingo.firebaseapp.com",
            projectId: "complaint-bingo",
            storageBucket: "complaint-bingo.firebasestorage.app",
            messagingSenderId: "403581028557",
            appId: "1:403581028557:web:13058c895b707bf7814184"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let currentUser = null;
        let currentEditId = null; 
        let unsubscribe = null;
        let allSites = [];
        let activeFilter = 'all';
        let currentSelectedTags = [];
        let selectedFile = null;

        auth.onAuthStateChanged(user => {
            const btn = document.getElementById('auth-btn');
            const userDisplay = document.getElementById('user-display');
            const statusDot = document.getElementById('status-dot');
            if (user) {
                currentUser = user;
                btn.innerText = "⎋";
                userDisplay.innerText = user.email;
                statusDot.className = "status-dot online";
                startVaultListener(user.uid);
            } else {
                currentUser = null;
                btn.innerText = "⊕";
                userDisplay.innerText = "Logged Out";
                statusDot.className = "status-dot";
                document.getElementById('vault-grid').innerHTML = '<p style="color:var(--text-dim)">Vault locked.</p>';
            }
        });

        function startVaultListener(uid) {
            if (unsubscribe) unsubscribe();
            unsubscribe = db.collection("sites").where("uid", "==", uid).onSnapshot(snapshot => {
                allSites = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                allSites.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                renderTags();
                renderSites();
            });
        }

        function renderTags() {
            const bar = document.getElementById('filter-bar');
            const tags = new Set();
            allSites.forEach(s => (s.tags || []).forEach(t => tags.add(t)));
            bar.innerHTML = `<div class="filter-chip ${activeFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All Sites</div>`;
            Array.from(tags).sort().forEach(tag => {
                const chip = document.createElement('div');
                chip.className = `filter-chip ${activeFilter === tag ? 'active' : ''}`;
                chip.innerText = tag;
                chip.onclick = () => setFilter(tag);
                bar.appendChild(chip);
            });
        }

        function setFilter(tag) { activeFilter = tag; renderTags(); renderSites(); }

        function renderSites() {
            const grid = document.getElementById('vault-grid');
            grid.innerHTML = '';
            const filtered = activeFilter === 'all' ? allSites : allSites.filter(s => (s.tags || []).includes(activeFilter));
            if (filtered.length === 0) { grid.innerHTML = '<p style="color:var(--text-dim)">No entries found.</p>'; return; }

            filtered.forEach(site => {
                const card = document.createElement('div');
                card.className = 'site-card';
                card.innerHTML = `
                    <div class="card-actions">
                        <button class="action-btn" onclick='openEditModal("${site.id}")'>✎</button>
                        <button class="action-btn" onclick="deleteSite('${site.id}', '${site.storage_url}')">×</button>
                    </div>
                    <div class="card-thumb" style="background-image: url('${site.storage_url || ''}')"></div>
                    <div class="card-content">
                        <a href="${site.primary_url}" target="_blank" class="card-title">${site.official_name}</a>
                        <p style="font-size:0.7rem; color:var(--text-dim); margin:0;">${site.short_description}</p>
                        <div class="tag-container">${(site.tags || []).map(t => `<span class="tag-pill">${t}</span>`).join('')}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleFileSelect(input) {
            if(input.files && input.files[0]) {
                selectedFile = input.files[0];
                document.getElementById('file-status').innerText = "Image selected: " + selectedFile.name;
                document.getElementById('file-status').style.color = "var(--accent)";
            }
        }

        function formatUrl(url) {
            if (!url) return "";
            let trimmed = url.trim();
            if (!/^https?:\/\//i.test(trimmed)) {
                return "https://" + trimmed;
            }
            return trimmed;
        }

        function openEditModal(id) {
            const site = allSites.find(s => s.id === id);
            currentEditId = id;
            currentSelectedTags = [...(site.tags || [])];
            selectedFile = null;
            document.getElementById('modal-title').innerText = "Refine Entry";
            document.getElementById('modal-save-btn').innerText = "Update";
            document.getElementById('file-status').innerText = "Click to upload new image";
            document.getElementById('file-status').style.color = "var(--text-dim)";
            document.getElementById('edit-name').value = site.official_name || "";
            document.getElementById('edit-url').value = site.primary_url || "";
            document.getElementById('edit-desc').value = site.short_description || "";
            document.getElementById('edit-tags').value = "";
            refreshTagPicker();
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function openManualAdd() {
            currentEditId = null;
            currentSelectedTags = [];
            selectedFile = null;
            document.getElementById('modal-title').innerText = "Manual Add Site";
            document.getElementById('modal-save-btn').innerText = "Create Site";
            document.getElementById('file-status').innerText = "Click to upload thumbnail";
            document.getElementById('file-status').style.color = "var(--text-dim)";
            document.getElementById('edit-name').value = "";
            document.getElementById('edit-url').value = "";
            document.getElementById('edit-desc').value = "";
            document.getElementById('edit-tags').value = "";
            refreshTagPicker();
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function refreshTagPicker() {
            const picker = document.getElementById('tag-picker');
            const masterTags = new Set();
            allSites.forEach(s => (s.tags || []).forEach(t => masterTags.add(t)));
            picker.innerHTML = '';
            Array.from(masterTags).sort().forEach(tag => {
                const div = document.createElement('div');
                div.className = `selectable-tag ${currentSelectedTags.includes(tag) ? 'selected' : ''}`;
                div.innerText = tag;
                div.onclick = () => {
                    if(currentSelectedTags.includes(tag)) currentSelectedTags = currentSelectedTags.filter(t => t !== tag);
                    else currentSelectedTags.push(tag);
                    refreshTagPicker();
                };
                picker.appendChild(div);
            });
        }

        async function saveChanges() {
            const btn = document.getElementById('modal-save-btn');
            const originalText = btn.innerText;
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const newTag = document.getElementById('edit-tags').value.trim().toLowerCase();
                if(newTag && !currentSelectedTags.includes(newTag)) currentSelectedTags.push(newTag);

                let sUrl = "";
                if (currentEditId) {
                    sUrl = allSites.find(s => s.id === currentEditId).storage_url || "";
                }
                
                if(selectedFile) {
                    const ref = storage.ref().child(`thumbnails/${currentUser.uid}/${Date.now()}_${selectedFile.name}`);
                    await ref.put(selectedFile);
                    sUrl = await ref.getDownloadURL();
                }

                const finalUrl = formatUrl(document.getElementById('edit-url').value);

                const payload = {
                    official_name: document.getElementById('edit-name').value, 
                    primary_url: finalUrl,
                    short_description: document.getElementById('edit-desc').value,
                    tags: currentSelectedTags,
                    storage_url: sUrl,
                    uid: currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };

                if (currentEditId) {
                    await db.collection("sites").doc(currentEditId).update(payload);
                } else {
                    await db.collection("sites").add(payload);
                }
                closeModal();
            } catch (e) { alert("Error saving."); console.error(e); } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        async function handleInput() {
            const urlInput = document.getElementById('site-input');
            const saveBtn = document.getElementById('add-btn');
            const val = urlInput.value.trim();
            const gKey = localStorage.getItem('gemini_key');
            if(!val || !gKey || !currentUser) return;

            const status = document.getElementById('status-msg');
            status.innerText = "Researching...";
            saveBtn.disabled = true;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Research "${val}". Return JSON: {"official_name": "string", "primary_url": "string", "short_description": "max 20 words", "tags": ["tag1", "tag2", "tag3"]}` }] }] })
                });
                
                if (!res.ok) throw new Error("API call failed");
                const data = await res.json();
                const cleanJson = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]);
                
                // Ensure researched URL is also properly formatted
                cleanJson.primary_url = formatUrl(cleanJson.primary_url);

                await db.collection("sites").add({ ...cleanJson, uid: currentUser.uid, storage_url: "", timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                status.innerText = "Success!";
                setTimeout(() => { status.innerText = ""; }, 2000);
                urlInput.value = '';
            } catch (e) { 
                status.innerText = "Error adding site. Try manual add or check URL."; 
                console.error(e);
            } finally {
                saveBtn.disabled = false;
            }
        }

        async function deleteSite(id, url) {
            if(confirm("Delete site?")) { 
                await db.collection("sites").doc(id).delete(); 
                if(url) storage.refFromURL(url).delete().catch(()=>{}); 
            }
        }

        async function handleAuthClick() {
            if(currentUser) { if(confirm("Sign out?")) auth.signOut(); }
            else {
                const e = prompt("Email:"); const p = prompt("Password:");
                if(e && p) auth.signInWithEmailAndPassword(e, p).catch(() => auth.createUserWithEmailAndPassword(e, p));
            }
        }
    </script>
</body>
</html>
