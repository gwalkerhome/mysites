<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.7.0 | mysites - visual home</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --danger: #f87171;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --sidebar-width: 80px;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* 10% SIDEBAR WITH ICONS */
        #sidebar { 
            width: var(--sidebar-width); 
            background: var(--sidebar-bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 24px 0; 
            border-right: 1px solid var(--border); 
            flex-shrink: 0; 
        }

        .nav-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
            text-decoration: none;
            font-size: 1.2rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }

        .nav-icon:hover, .nav-icon.active { 
            background: var(--accent); 
            color: #000; 
            transform: scale(1.05); 
        }

        #main-scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 40px;
        }

        /* SITE OF THE DAY HERO */
        #featured-portal { 
            height: 350px; 
            background: linear-gradient(rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=1500'); 
            background-size: cover; 
            background-position: center; 
            border-radius: 24px; 
            margin-bottom: 50px; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding: 40px;
            border: 1px solid var(--border);
            position: relative;
        }

        .hero-tag {
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            width: fit-content;
            margin-bottom: 12px;
        }

        .drop-zone-mini {
            max-width: 600px;
            margin: 0 auto 40px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        #site-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px 15px;
            outline: none;
        }

        #vault-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; 
        }

        .site-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            overflow: hidden; 
            position: relative; 
            height: 280px;
            display: flex;
            flex-direction: column;
        }

        .card-thumb { 
            height: 140px; 
            background-size: cover; 
            background-position: top center; 
            flex-shrink: 0;
            background-color: #020617;
        }

        .card-content { padding: 12px; }
        .card-title { font-weight: 700; color: var(--text); text-decoration: none; font-size: 0.95rem; }
        .card-desc { font-size: 0.8rem; color: var(--text-dim); margin-top: 5px; line-height: 1.3; }

        .card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; opacity: 0; transition: 0.2s; }
        .site-card:hover .card-actions { opacity: 1; }
        
        .action-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.8); border: 1px solid var(--border); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .action-btn:hover { background: var(--accent); color: black; }

        /* SCROLLBAR STYLE */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div style="font-weight: 900; color: var(--accent); margin-bottom: 40px; font-size: 1.2rem;">MS</div>
        
        <a href="index.html" class="nav-icon active" title="Home">⌂</a>
        <a href="#" class="nav-icon" title="Favorites">♥</a>
        <a href="#" class="nav-icon" title="Curiosities">✨</a>
        <a href="apisettings.html" class="nav-icon" title="Settings">⚙</a>
        
        <div style="margin-top: auto;">
            <div id="auth-indicator" style="width: 10px; height: 10px; border-radius: 50%; background: var(--danger); margin-bottom: 20px;"></div>
            <button class="nav-icon" onclick="handleAuthClick()" title="Login/Logout">⎋</button>
        </div>
    </nav>

    <main id="main-scroll-container">
        
        <section id="featured-portal">
            <div class="hero-tag">SITE OF THE DAY</div>
            <h1 id="hero-title" style="margin: 0; font-size: 2.5rem;">Exploring the Web...</h1>
            <p id="hero-desc" style="color: var(--text-dim); max-width: 600px;">Your visual vault is ready for new discoveries.</p>
        </section>

        <div class="drop-zone-mini">
            <input type="text" id="site-input" placeholder="Drop a URL or site name here...">
            <button class="btn-stage-1" style="background: var(--accent); color: #000; padding: 8px 20px;" onclick="handleInput()">Add</button>
        </div>

        <div id="status-msg" style="text-align: center; margin-bottom: 20px; font-size: 0.8rem; color: var(--accent);"></div>

        <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: var(--text-dim);">Recent Discoveries</h2>
        <div id="vault-grid"></div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjdXXUzFOsf5wKDJVGt7TQzHNFj2bEkVY",
            authDomain: "complaint-bingo.firebaseapp.com",
            projectId: "complaint-bingo",
            storageBucket: "complaint-bingo.firebasestorage.app",
            messagingSenderId: "403581028557",
            appId: "1:403581028557:web:13058c895b707bf7814184"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let currentUser = null;

        auth.onAuthStateChanged(user => {
            currentUser = user;
            document.getElementById('auth-indicator').style.background = user ? "#22c55e" : var(--danger);
            if (user) startVaultListener(user.uid);
        });

        function renderSites(snapshot) {
            const grid = document.getElementById('vault-grid');
            grid.innerHTML = '';
            
            let first = true;
            snapshot.forEach(doc => {
                const site = doc.data();
                const id = doc.id;

                // Update Hero with the most recent site
                if (first) {
                    document.getElementById('hero-title').innerText = site.official_name;
                    document.getElementById('hero-desc').innerText = site.short_description;
                    if(site.storage_url) document.getElementById('featured-portal').style.backgroundImage = `linear-gradient(rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.95)), url('${site.storage_url}')`;
                    first = false;
                }

                const card = document.createElement('div');
                card.className = 'site-card';
                let thumb = site.storage_url ? `background-image: url('${site.storage_url}');` : `background: linear-gradient(45deg, #0f172a, #1e293b);`;
                
                card.innerHTML = `
                    <div class="card-actions">
                        <button class="action-btn" onclick="toggleFav('${id}')">♥</button>
                        <button class="action-btn" onclick="deleteSite('${id}', '${site.storage_url}')">×</button>
                    </div>
                    <div class="card-thumb" style="${thumb}">${site.storage_url ? '' : site.official_name.charAt(0)}</div>
                    <div class="card-content">
                        <a href="${site.primary_url}" target="_blank" class="card-title">${site.official_name}</a>
                        <p class="card-desc">${site.short_description}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function startVaultListener(uid) {
            db.collection("sites").where("uid", "==", uid).orderBy("timestamp", "desc").onSnapshot(renderSites);
        }

        async function handleInput() {
            const val = document.getElementById('site-input').value.trim();
            const gKey = localStorage.getItem('gemini_key');
            if (!val || !gKey) return;
            const status = document.getElementById('status-msg');
            status.innerText = "Researching...";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Research "${val}". Return ONLY JSON: {"official_name": "string", "primary_url": "string", "short_description": "max 20 words"}` }] }] })
                });
                const data = await res.json();
                const cleanJson = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]);
                
                status.innerText = "Capturing...";
                const screenshotUrl = `https://api.microlink.io/?url=${encodeURIComponent(cleanJson.primary_url)}&screenshot=true&embed=screenshot.url`;
                const blob = await (await fetch(screenshotUrl)).blob();
                const storageRef = storage.ref().child(`thumbnails/${currentUser.uid}/${Date.now()}.png`);
                await storageRef.put(blob);
                const sUrl = await storageRef.getDownloadURL();

                await db.collection("sites").add({ ...cleanJson, uid: currentUser.uid, storage_url: sUrl, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                status.innerText = "";
                document.getElementById('site-input').value = '';
            } catch (e) { status.innerText = "Error adding site."; }
        }

        async function deleteSite(id, url) {
            if(confirm("Delete?")) {
                await db.collection("sites").doc(id).delete();
                if(url) storage.refFromURL(url).delete().catch(()=>{});
            }
        }

        async function handleAuthClick() {
            const email = prompt("Email:"); const pass = prompt("Password:");
            if (email && pass) auth.signInWithEmailAndPassword(email, pass).catch(() => auth.createUserWithEmailAndPassword(email, pass));
        }
    </script>
</body>
</html>
