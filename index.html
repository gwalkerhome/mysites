<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.6.0 | mysites - visual vault</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --danger: #f87171;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --modal-overlay: rgba(0, 0, 0, 0.8);
        }

        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        #sidebar { width: 260px; background: var(--sidebar-bg); padding: 24px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--border); flex-shrink: 0; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 24px; }

        .btn-stage-1 { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .btn-stage-1:hover { background: var(--accent); color: #000; transform: translateX(4px); }
        .btn-active { background: var(--accent); color: #000; border-color: var(--accent); }

        #main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }

        #featured-portal { height: 280px; background: linear-gradient(rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1000'); background-size: cover; background-position: center; border-radius: 20px; margin-bottom: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid var(--border); text-align: center; }

        .drop-zone-container { max-width: 800px; margin: 0 auto 50px; }
        .drop-zone { background: var(--card-bg); border: 2px dashed var(--border); border-radius: 16px; padding: 48px 24px; text-align: center; }

        .input-wrapper { display: flex; gap: 12px; max-width: 600px; margin: 0 auto; }
        #site-input { flex-grow: 1; padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--sidebar-bg); color: white; outline: none; }
        #status-msg { margin-top: 15px; font-size: 0.85rem; color: var(--accent); min-height: 1.2rem; }

        #vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 20px; }

        .site-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; position: relative; transition: transform 0.2s; }
        .site-card:hover .card-actions { opacity: 1; }

        .card-thumb { height: 160px; background: linear-gradient(45deg, #0f172a, #1e293b); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 2.5rem; font-weight: 800; background-size: cover; background-position: top center; }
        .card-content { padding: 16px; }
        .card-title { font-weight: 700; margin-bottom: 4px; color: var(--text); display: block; text-decoration: none; }
        .card-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; }

        .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; opacity: 0; transition: opacity 0.2s; }
        .action-btn { width: 32px; height: 32px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .action-btn:hover { background: var(--accent); color: black; }
        .btn-del:hover { background: var(--danger); color: white; }

        /* Modal Styles */
        #edit-modal { display: none; position: fixed; inset: 0; background: var(--modal-overlay); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 500px; border-radius: 20px; padding: 30px; border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .modal-field { margin-bottom: 20px; }
        .modal-field label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }
        .modal-field input, .modal-field textarea { width: 100%; padding: 12px; border-radius: 8px; background: var(--sidebar-bg); border: 1px solid var(--border); color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div class="logo">mysites</div>
        <div id="user-info" style="font-size:0.75rem; color:var(--text-dim); margin-bottom:12px; padding-left:12px;">Not Logged In</div>
        <a href="index.html" class="btn-stage-1 btn-active">Dashboard</a>
        <a href="apisettings.html" class="btn-stage-1">API Engine</a>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <button id="auth-btn" class="btn-stage-1" style="background: var(--accent); color: #000;" onclick="handleAuthClick()">Login</button>
        </div>
    </nav>

    <main id="main-content">
        <section id="featured-portal">
            <h1>Curate Your World</h1>
            <p>Every site tells a story. Edit yours.</p>
        </section>

        <section class="drop-zone-container">
            <div class="drop-zone">
                <div class="input-wrapper">
                    <input type="text" id="site-input" placeholder="Enter site name or URL...">
                    <button class="btn-stage-1" style="background: var(--accent); color: #000;" onclick="handleInput()">Add Site</button>
                </div>
                <div id="status-msg"></div>
            </div>
        </section>

        <div id="vault-grid"></div>
    </main>

    <div id="edit-modal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">Edit Site Info</h2>
            <div class="modal-field">
                <label>Site Name</label>
                <input type="text" id="edit-name">
            </div>
            <div class="modal-field">
                <label>Description</label>
                <textarea id="edit-desc" rows="3"></textarea>
            </div>
            <div class="modal-field">
                <label>Replace Thumbnail (Optional)</label>
                <input type="file" id="edit-file" accept="image/*">
            </div>
            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <button class="btn-stage-1" style="flex:1; background: var(--accent); color: black;" onclick="saveChanges()">Save Changes</button>
                <button class="btn-stage-1" style="flex:1;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjdXXUzFOsf5wKDJVGt7TQzHNFj2bEkVY",
            authDomain: "complaint-bingo.firebaseapp.com",
            databaseURL: "https://complaint-bingo-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "complaint-bingo",
            storageBucket: "complaint-bingo.firebasestorage.app",
            messagingSenderId: "403581028557",
            appId: "1:403581028557:web:13058c895b707bf7814184"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let currentUser = null;
        let currentEditId = null;

        auth.onAuthStateChanged(user => {
            currentUser = user;
            document.getElementById('user-info').innerText = user ? `Logged in: ${user.email}` : "Not Logged In";
            if (user) startVaultListener(user.uid);
        });

        function renderSites(snapshot) {
            const grid = document.getElementById('vault-grid');
            grid.innerHTML = '';
            snapshot.forEach(doc => {
                const site = doc.data();
                const id = doc.id;
                const card = document.createElement('div');
                card.className = 'site-card';
                let thumbStyle = site.storage_url ? `background-image: url('${site.storage_url}');` : `background: linear-gradient(45deg, #0f172a, #1e293b);`;
                
                card.innerHTML = `
                    <div class="card-actions">
                        <button class="action-btn" onclick='openEditModal("${id}", ${JSON.stringify(site).replace(/"/g, '&quot;')})'>✎</button>
                        <button class="action-btn btn-del" onclick="deleteSite('${id}', '${site.storage_url}')">×</button>
                    </div>
                    <div class="card-thumb" style="${thumbStyle}">${site.storage_url ? '' : (site.official_name || '?').charAt(0)}</div>
                    <div class="card-content">
                        <a href="${site.primary_url}" target="_blank" class="card-title">${site.official_name}</a>
                        <div class="card-desc">${site.short_description}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openEditModal(id, data) {
            currentEditId = id;
            document.getElementById('edit-name').value = data.official_name;
            document.getElementById('edit-desc').value = data.short_description;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        async function saveChanges() {
            const newName = document.getElementById('edit-name').value;
            const newDesc = document.getElementById('edit-desc').value;
            const fileInput = document.getElementById('edit-file');
            let updateObj = { official_name: newName, short_description: newDesc };

            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                const fileName = `thumbnails/${currentUser.uid}/${Date.now()}_custom.png`;
                const storageRef = storage.ref().child(fileName);
                await storageRef.put(file);
                updateObj.storage_url = await storageRef.getDownloadURL();
            }

            await db.collection("sites").doc(currentEditId).update(updateObj);
            closeModal();
        }

        async function deleteSite(id, storageUrl) {
            if (confirm("Delete this site?")) {
                await db.collection("sites").doc(id).delete();
                if (storageUrl) storage.refFromURL(storageUrl).delete().catch(() => {});
            }
        }

        function startVaultListener(uid) {
            db.collection("sites").where("uid", "==", uid).orderBy("timestamp", "desc").onSnapshot(renderSites);
        }

        async function handleInput() {
            const val = document.getElementById('site-input').value.trim();
            const gKey = localStorage.getItem('gemini_key');
            if (!val || !gKey) return;
            document.getElementById('status-msg').innerText = "Gemini researching...";
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Research "${val}". Return ONLY JSON: {"official_name": "string", "primary_url": "string", "short_description": "max 20 words"}` }] }] })
                });
                const data = await res.json();
                const cleanJson = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]);
                
                document.getElementById('status-msg').innerText = "Taking snapshot...";
                const screenshotUrl = `https://api.microlink.io/?url=${encodeURIComponent(cleanJson.primary_url)}&screenshot=true&embed=screenshot.url`;
                const blob = await (await fetch(screenshotUrl)).blob();
                const storageRef = storage.ref().child(`thumbnails/${currentUser.uid}/${Date.now()}.png`);
                await storageRef.put(blob);
                const sUrl = await storageRef.getDownloadURL();

                await db.collection("sites").add({ ...cleanJson, uid: currentUser.uid, storage_url: sUrl, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('status-msg').innerText = "Added!";
                document.getElementById('site-input').value = '';
            } catch (e) { document.getElementById('status-msg').innerText = "Error!"; }
        }

        async function handleAuthClick() {
            const email = prompt("Email:"); const pass = prompt("Password:");
            if (email && pass) auth.signInWithEmailAndPassword(email, pass).catch(() => auth.createUserWithEmailAndPassword(email, pass));
        }
    </script>
</body>
</html>
