<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.8.2 | mysites - visibility fix</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #020617;
            --surface: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --top-h: 70px;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: var(--bg-color); color: var(--text); 
            display: flex; height: 100vh; width: 100vw; overflow: hidden; 
        }

        #sidebar { 
            width: 70px; background: var(--bg-color); 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px 0; border-right: 1px solid var(--border); flex-shrink: 0;
        }

        .nav-icon { 
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; margin-bottom: 15px; cursor: pointer; text-decoration: none;
            background: var(--surface); color: var(--text-dim); border: 1px solid var(--border);
            font-size: 1.2rem; transition: 0.2s;
        }
        .nav-icon:hover, .nav-icon.active { background: var(--accent); color: #000; }

        #viewport { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; }

        #top-bar { 
            height: var(--top-h); padding: 0 30px; display: flex; gap: 15px; align-items: center; 
            border-bottom: 1px solid var(--border); background: var(--bg-color); flex-shrink: 0;
        }
        .search-box { 
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            padding: 10px 15px; border-radius: 8px; color: white; outline: none;
        }

        /* SCROLLABLE AREA */
        #main-content { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 30px; 
        }

        .dashboard-grid { 
            display: grid; grid-template-columns: 2fr 1fr; gap: 25px; margin-bottom: 40px;
        }

        #featured-portal { 
            height: 280px; border-radius: 20px; border: 1px solid var(--border);
            background: linear-gradient(rgba(15,23,42,0.8), rgba(15,23,42,0.95)), url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; padding: 40px;
        }

        .drop-bar { 
            margin-top: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 10px; border-radius: 12px; display: flex; gap: 10px;
        }
        .drop-bar input { background: transparent; border: none; color: white; flex: 1; outline: none; }

        .widget { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        #scratchpad { width: 100%; height: 120px; background: transparent; border: none; color: var(--text); resize: none; outline: none; font-size: 0.9rem; }

        /* THE FIX: VAULT GRID */
        #vault-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 25px; 
            min-height: 400px; /* Force visibility */
            padding-bottom: 100px;
        }

        .site-card { 
            background: var(--card-bg); border-radius: 16px; overflow: hidden; 
            border: 1px solid var(--border); height: 260px;
        }
        .card-thumb { height: 140px; background-size: cover; background-position: center; background-color: #020617; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 60px; flex-direction: row; order: 2; border-top: 1px solid var(--border); }
            #viewport { height: calc(100vh - 60px); }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div style="color:var(--accent); font-weight:900; margin-bottom:20px;">MS</div>
        <a href="index.html" class="nav-icon active">⌂</a>
        <a href="#" class="nav-icon">♥</a>
        <a href="#" class="nav-icon">✨</a>
        <a href="apisettings.html" class="nav-icon">⚙</a>
        <button class="nav-icon" onclick="handleAuthClick()" style="margin-top:auto;">⎋</button>
    </nav>

    <div id="viewport">
        <header id="top-bar">
            <form action="https://www.google.com/search" method="GET" style="flex:1; display:flex;">
                <input type="text" name="q" class="search-box" placeholder="Google Search...">
            </form>
            <input type="text" id="gemini-chat" class="search-box" style="border-color: var(--accent);" placeholder="Ask Gemini AI...">
        </header>

        <main id="main-content">
            <div class="dashboard-grid">
                <section id="featured-portal">
                    <h2 id="hero-title" style="margin:0">Vault Initializing...</h2>
                    <p id="hero-desc" style="color:var(--text-dim); margin:10px 0 20px 0;">Sign in to view your sites.</p>
                    <div class="drop-bar">
                        <input type="text" id="site-input" placeholder="Paste URL here...">
                        <button onclick="handleInput()" style="background:var(--accent); border:none; padding:8px 20px; border-radius:8px; cursor:pointer;">Save</button>
                    </div>
                </section>

                <div class="utility-rail">
                    <div class="widget">
                        <div style="font-size:0.7rem; color:var(--accent); margin-bottom:10px;">SCRATCHPAD</div>
                        <textarea id="scratchpad"></textarea>
                    </div>
                    <div class="widget" style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.8rem;">TIMER</span>
                        <div id="timer" style="font-weight:bold; color:var(--accent); cursor:pointer;" onclick="toggleTimer()">25:00</div>
                    </div>
                </div>
            </div>

            <h3 style="margin-bottom: 20px;">Library</h3>
            <div id="vault-grid">
                <p style="color:var(--text-dim)">Checking for sites...</p>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjdXXUzFOsf5wKDJVGt7TQzHNFj2bEkVY",
            authDomain: "complaint-bingo.firebaseapp.com",
            projectId: "complaint-bingo",
            storageBucket: "complaint-bingo.firebasestorage.app",
            messagingSenderId: "403581028557",
            appId: "1:403581028557:web:13058c895b707bf7814184"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let currentUser = null;

        // SCRATCHPAD
        const pad = document.getElementById('scratchpad');
        pad.value = localStorage.getItem('vault_notes') || "";
        pad.oninput = () => localStorage.setItem('vault_notes', pad.value);

        // TIMER
        let timeLeft = 1500; let timerInterval = null;
        function toggleTimer() {
            if(timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            else {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    let m = Math.floor(timeLeft/60); let s = timeLeft % 60;
                    document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                }, 1000);
            }
        }

        auth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) startVaultListener(user.uid);
            else document.getElementById('vault-grid').innerHTML = '<p style="color:var(--text-dim)">Please login to see your sites.</p>';
        });

        function renderSites(snapshot) {
            const grid = document.getElementById('vault-grid');
            if (snapshot.empty) {
                grid.innerHTML = '<p style="color:var(--text-dim)">No sites found. Add one above!</p>';
                return;
            }
            grid.innerHTML = '';
            let first = true;
            snapshot.forEach(doc => {
                const site = doc.data();
                if(first) {
                    document.getElementById('hero-title').innerText = site.official_name;
                    document.getElementById('hero-desc').innerText = site.short_description;
                    if(site.storage_url) document.getElementById('featured-portal').style.backgroundImage = `linear-gradient(rgba(15,23,42,0.8), rgba(15,23,42,0.95)), url('${site.storage_url}')`;
                    first = false;
                }
                const card = document.createElement('div');
                card.className = 'site-card';
                card.innerHTML = `
                    <div class="card-thumb" style="background-image: url('${site.storage_url || ''}')"></div>
                    <div style="padding:15px">
                        <a href="${site.primary_url}" target="_blank" style="color:white; text-decoration:none; font-weight:bold; font-size:0.9rem;">${site.official_name}</a>
                        <p style="color:var(--text-dim); font-size:0.75rem; margin-top:5px;">${site.short_description}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function startVaultListener(uid) {
            db.collection("sites").where("uid", "==", uid).orderBy("timestamp", "desc").onSnapshot(renderSites);
        }

        async function handleInput() {
            const val = document.getElementById('site-input').value.trim();
            const gKey = localStorage.getItem('gemini_key');
            if(!val || !gKey) return;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Research "${val}". Return JSON: {"official_name": "string", "primary_url": "string", "short_description": "max 20 words"}` }] }] })
                });
                const data = await res.json();
                const cleanJson = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]);
                const screenshotUrl = `https://api.microlink.io/?url=${encodeURIComponent(cleanJson.primary_url)}&screenshot=true&embed=screenshot.url`;
                const blob = await (await fetch(screenshotUrl)).blob();
                const ref = storage.ref().child(`thumbnails/${currentUser.uid}/${Date.now()}.png`);
                await ref.put(blob);
                const sUrl = await ref.getDownloadURL();
                await db.collection("sites").add({ ...cleanJson, uid: currentUser.uid, storage_url: sUrl, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('site-input').value = '';
            } catch (e) { alert("Error adding site"); }
        }

        async function handleAuthClick() {
            const email = prompt("Email:"); const pass = prompt("Password:");
            if (email && pass) auth.signInWithEmailAndPassword(email, pass).catch(() => auth.createUserWithEmailAndPassword(email, pass));
        }
    </script>
</body>
</html>
