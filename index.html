<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.4.0 | mysites - visual vault</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 24px; }

        .btn-stage-1 {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-stage-1:hover { background: var(--accent); color: #000; transform: translateX(4px); }
        .btn-active { background: var(--accent); color: #000; border-color: var(--accent); }

        #main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }

        .drop-zone-container { max-width: 800px; margin: 0 auto 50px; }
        .drop-zone {
            background: var(--card-bg); border: 2px dashed var(--border);
            border-radius: 16px; padding: 48px 24px; text-align: center;
        }

        .input-wrapper { display: flex; gap: 12px; max-width: 600px; margin: 0 auto; }
        #site-input { flex-grow: 1; padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--sidebar-bg); color: white; outline: none; }
        #status-msg { margin-top: 15px; font-size: 0.85rem; color: var(--accent); min-height: 1.2rem; }

        #user-info { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; padding-left: 16px; }

        #vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .site-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card-thumb {
            height: 160px;
            background: linear-gradient(45deg, #0f172a, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 2rem;
            font-weight: 800;
            background-size: cover;
            background-position: center;
        }

        .card-content { padding: 16px; }
        .card-title { font-weight: 700; margin-bottom: 4px; color: var(--text); display: block; text-decoration: none; }
        .card-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; }
        .badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; background: #020617; border: 1px solid var(--border); color: var(--text-dim); margin-right: 5px; }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div class="logo">mysites</div>
        <div id="user-info">Not Logged In</div>
        <a href="index.html" class="btn-stage-1 btn-active">Dashboard</a>
        <a href="apisettings.html" class="btn-stage-1">API Engine</a>
        <a href="apitest.html" class="btn-stage-1">Test Suite</a>
        
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <button id="auth-btn" class="btn-stage-1" style="background: var(--accent); color: #000;" onclick="handleAuthClick()">Login</button>
            <button class="btn-stage-1" onclick="location.href='settings.html'">Settings</button>
        </div>
    </nav>

    <main id="main-content">
        <section class="drop-zone-container">
            <div class="drop-zone">
                <h2>Add to Vault</h2>
                <div class="input-wrapper">
                    <input type="text" id="site-input" placeholder="Enter web address or name...">
                    <button class="btn-stage-1" style="background: var(--accent); color: #000;" onclick="handleInput()">Add Site</button>
                </div>
                <div id="status-msg"></div>
            </div>
        </section>

        <h3>My Collection</h3>
        <div id="vault-grid"></div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjdXXUzFOsf5wKDJVGt7TQzHNFj2bEkVY",
            authDomain: "complaint-bingo.firebaseapp.com",
            databaseURL: "https://complaint-bingo-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "complaint-bingo",
            storageBucket: "complaint-bingo.firebasestorage.app",
            messagingSenderId: "403581028557",
            appId: "1:403581028557:web:13058c895b707bf7814184"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let currentUser = null;
        let unsubscribe = null;

        auth.onAuthStateChanged(user => {
            currentUser = user;
            const ui = document.getElementById('user-info');
            const ab = document.getElementById('auth-btn');
            if (user) {
                ui.innerText = `Logged in: ${user.email}`;
                ab.innerText = "Logout";
                ab.style.background = "transparent"; ab.style.color = "var(--text-dim)";
                startVaultListener(user.uid);
            } else {
                ui.innerText = "Not Logged In";
                ab.innerText = "Login / Signup";
                ab.style.background = "var(--accent)"; ab.style.color = "#000";
                if (unsubscribe) unsubscribe();
                document.getElementById('vault-grid').innerHTML = '';
            }
        });

        function startVaultListener(uid) {
            unsubscribe = db.collection("sites").where("uid", "==", uid).orderBy("timestamp", "desc").onSnapshot(snapshot => {
                const grid = document.getElementById('vault-grid');
                grid.innerHTML = '';
                snapshot.forEach(async doc => {
                    const site = doc.data();
                    const card = document.createElement('div');
                    card.className = 'site-card';
                    
                    let thumbStyle = `background: linear-gradient(45deg, #0f172a, #1e293b);`;
                    if (site.storage_url) {
                        thumbStyle = `background-image: url('${site.storage_url}');`;
                    }

                    card.innerHTML = `
                        <div class="card-thumb" style="${thumbStyle}">${site.storage_url ? '' : site.official_name.charAt(0)}</div>
                        <div class="card-content">
                            <a href="${site.primary_url}" target="_blank" class="card-title">${site.official_name}</a>
                            <div class="card-desc">${site.short_description}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        async function handleInput() {
            if (!currentUser) { alert("Login first!"); return; }
            const inputField = document.getElementById('site-input');
            const statusMsg = document.getElementById('status-msg');
            const gKey = localStorage.getItem('gemini_key');
            const value = inputField.value.trim();
            
            if (!value || !gKey) return;

            statusMsg.innerText = "Gemini researching & finding assets...";
            
            const promptStr = `Research "${value}". Return ONLY JSON: {"official_name": "string", "primary_url": "string", "short_description": "max 20 words", "requires_login": boolean, "is_subscription": boolean, "representative_image_url": "URL to high-res logo or OG image"}`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
                });
                const data = await res.json();
                const rawText = data.candidates[0].content.parts[0].text;
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                const cleanJson = JSON.parse(jsonMatch[0]);

                let storageUrl = null;
                if (cleanJson.representative_image_url) {
                    statusMsg.innerText = "Securing image to your vault storage...";
                    storageUrl = await uploadToVault(cleanJson.representative_image_url, cleanJson.official_name);
                }

                statusMsg.innerText = "Saving to database...";
                await db.collection("sites").add({
                    ...cleanJson,
                    uid: currentUser.uid,
                    storage_url: storageUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                statusMsg.innerText = "Success!";
                inputField.value = '';
                setTimeout(() => statusMsg.innerText = "", 3000);
            } catch (e) { 
                console.error(e);
                statusMsg.innerText = "Error: " + e.message; 
            }
        }

        async function uploadToVault(url, name) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const fileName = `thumbnails/${currentUser.uid}/${Date.now()}_${name.replace(/\s+/g, '_').toLowerCase()}.png`;
                const storageRef = storage.ref().child(fileName);
                await storageRef.put(blob);
                return await storageRef.getDownloadURL();
            } catch (e) {
                console.warn("Could not save image to storage, skipping visual.", e);
                return null;
            }
        }

        async function handleAuthClick() {
            if (currentUser) { await auth.signOut(); } 
            else {
                const email = prompt("Email:"); const pass = prompt("Password:");
                if (email && pass) {
                    await auth.signInWithEmailAndPassword(email, pass).catch(() => auth.createUserWithEmailAndPassword(email, pass));
                }
            }
        }
    </script>
</body>
</html>
