<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.2.0 | mysites - visual vault</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 24px;
            letter-spacing: -0.025em;
        }

        .btn-stage-1 {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .btn-stage-1:hover {
            background: var(--accent);
            color: #000;
            transform: translateX(4px);
            border-color: var(--accent);
        }

        .btn-active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        #main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        #featured-portal {
            height: 320px;
            background: linear-gradient(rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .portal-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--accent);
            color: #000;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .drop-zone-container {
            max-width: 800px;
            margin: 0 auto 50px;
        }

        .drop-zone {
            background: var(--card-bg);
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        #site-input {
            flex-grow: 1;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--sidebar-bg);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        #status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--accent);
            min-height: 1.2rem;
        }

        #sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 60px;
            text-align: center;
            color: var(--text-dim);
            background: rgba(30, 41, 59, 0.3);
            border-radius: 16px;
        }

        #user-info {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            padding-left: 16px;
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div class="logo">mysites</div>
        <div id="user-info">Not Logged In</div>
        <a href="index.html" class="btn-stage-1 btn-active">Dashboard</a>
        <a href="apisettings.html" class="btn-stage-1">API Engine</a>
        <a href="apitest.html" class="btn-stage-1">Test Suite</a>
        
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <button id="auth-btn" class="btn-stage-1" style="background: var(--accent); color: #000;" onclick="toggleAuth()">Login with Google</button>
            <button class="btn-stage-1" onclick="location.href='settings.html'">Settings</button>
        </div>
    </nav>

    <main id="main-content">
        <section id="featured-portal">
            <span class="portal-badge">Featured Discovery</span>
            <h1 style="font-size: 2.5rem; margin-bottom: 12px;">Your Personal Web Vault</h1>
            <p style="color: var(--text-dim); font-size: 1.1rem; max-width: 500px;">Capture the weird and wonderful websites you find before they vanish from memory.</p>
        </section>

        <section class="drop-zone-container">
            <div class="drop-zone">
                <h2>Drop a link here</h2>
                <p>Paste a URL or search for a site name</p>
                <div class="input-wrapper">
                    <input type="text" id="site-input" placeholder="Enter web address or name...">
                    <button class="btn-stage-1" style="background: var(--accent); color: #000; flex-shrink: 0;" onclick="handleInput()">Add Site</button>
                </div>
                <div id="status-msg"></div>
            </div>
        </section>

        <div id="sites-grid">
            <div class="empty-state">
                <p>No sites saved yet. Start by adding a link above.</p>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjdXXUzFOsf5wKDJVGt7TQzHNFj2bEkVY",
            authDomain: "complaint-bingo.firebaseapp.com",
            databaseURL: "https://complaint-bingo-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "complaint-bingo",
            storageBucket: "complaint-bingo.firebasestorage.app",
            messagingSenderId: "403581028557",
            appId: "1:403581028557:web:13058c895b707bf7814184"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;

        auth.onAuthStateChanged(user => {
            currentUser = user;
            const ui = document.getElementById('user-info');
            const ab = document.getElementById('auth-btn');
            if (user) {
                ui.innerText = `Logged in as: ${user.email}`;
                ab.innerText = "Logout";
                ab.style.background = "transparent";
                ab.style.color = "var(--text-dim)";
            } else {
                ui.innerText = "Not Logged In";
                ab.innerText = "Login with Google";
                ab.style.background = "var(--accent)";
                ab.style.color = "#000";
            }
        });

        async function toggleAuth() {
            if (currentUser) {
                await auth.signOut();
            } else {
                try {
                    await auth.signInWithPopup(provider);
                } catch (e) { alert("Login failed: " + e.message); }
            }
        }

        async function handleInput() {
            if (!currentUser) {
                alert("Please login first to save sites to your vault.");
                return;
            }

            const inputField = document.getElementById('site-input');
            const statusMsg = document.getElementById('status-msg');
            const gKey = localStorage.getItem('gemini_key');
            const value = inputField.value.trim();
            
            if (!value) return;
            if (!gKey) {
                alert("Add your Gemini Key in API Engine first.");
                return;
            }

            statusMsg.innerText = "Gemini is researching...";
            inputField.value = '';

            const prompt = `Research "${value}". Return ONLY a raw JSON object (no markdown backticks): {"official_name": "string", "primary_url": "string", "short_description": "max 20 words", "requires_login": boolean, "is_subscription": boolean, "thumbnail_prompt": "visual description"}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${gKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                
                if (!data.candidates || !data.candidates[0]) throw new Error("Gemini returned an empty result.");
                
                let rawText = data.candidates[0].content.parts[0].text;
                // Hardened JSON cleaning
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("No valid JSON found in response.");
                
                const cleanJson = JSON.parse(jsonMatch[0]);

                statusMsg.innerText = "Saving to Firestore...";

                await db.collection("sites").add({
                    ...cleanJson,
                    uid: currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'pending_visual'
                });

                statusMsg.innerText = `Success! "${cleanJson.official_name}" added.`;
                setTimeout(() => { statusMsg.innerText = ""; }, 4000);

            } catch (error) {
                console.error(error);
                statusMsg.innerText = "Error: " + error.message;
            }
        }

        document.getElementById('site-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleInput();
        });
    </script>
</body>
</html>
