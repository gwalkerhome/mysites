<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.0.0 | mysites - visual vault</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Navigation Sidebar */
        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 24px;
            letter-spacing: -0.025em;
        }

        /* Button Stage 1 Design */
        .btn-stage-1 {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-stage-1:hover {
            background: var(--accent);
            color: #000;
            transform: translateX(4px);
            border-color: var(--accent);
        }

        .btn-active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* Main Dashboard Area */
        #main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Today's Featured Site Portal */
        #featured-portal {
            height: 320px;
            background: linear-gradient(rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .portal-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--accent);
            color: #000;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Link Drop Zone */
        .drop-zone-container {
            max-width: 800px;
            margin: 0 auto 50px;
        }

        .drop-zone {
            background: var(--card-bg);
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .drop-zone:focus-within {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }

        .drop-zone h2 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
        }

        .drop-zone p {
            color: var(--text-dim);
            margin-bottom: 24px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        #site-input {
            flex-grow: 1;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--sidebar-bg);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #site-input:focus {
            border-color: var(--accent);
        }

        /* Sites Grid Placeholder */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        #sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 60px;
            text-align: center;
            color: var(--text-dim);
            background: rgba(30, 41, 59, 0.3);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div class="logo">mysites</div>
        <button class="btn-stage-1 btn-active" onclick="location.href='index.html'">Dashboard</button>
        <button class="btn-stage-1">Recent Finds</button>
        <button class="btn-stage-1">Favorites</button>
        <button class="btn-stage-1">Categories</button>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <button class="btn-stage-1" onclick="location.href='settings.html'">Settings</button>
            <button class="btn-stage-1" style="background: transparent; border-color: transparent; color: var(--text-dim);" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <main id="main-content">
        <section id="featured-portal">
            <span class="portal-badge">Featured Discovery</span>
            <h1 style="font-size: 2.5rem; margin-bottom: 12px;">Your Personal Web Vault</h1>
            <p style="color: var(--text-dim); font-size: 1.1rem; max-width: 500px;">Capture the weird and wonderful websites you find before they vanish from memory.</p>
        </section>

        <section class="drop-zone-container">
            <div class="drop-zone">
                <h2>Drop a link here</h2>
                <p>Paste a URL or search for a site name to start your collection</p>
                <div class="input-wrapper">
                    <input type="text" id="site-input" placeholder="Enter web address or name...">
                    <button class="btn-stage-1" style="background: var(--accent); color: #000; flex-shrink: 0;" onclick="handleInput()">Add Site</button>
                </div>
            </div>
        </section>

        <div class="section-header">
            <h3>My Collection</h3>
            <span style="color: var(--text-dim); font-size: 0.9rem;">Sort by: Newest</span>
        </div>
        
        <div id="sites-grid">
            <div class="empty-state">
                <p>No sites saved yet. Start by adding a link above.</p>
            </div>
        </div>
    </main>

    <script>
        // Firebase Configuration (v1.0.0)
        const firebaseConfig = {
            apiKey: "AIzaSyDjdXXUzFOsf5wKDJVGt7TQzHNFj2bEkVY",
            authDomain: "complaint-bingo.firebaseapp.com",
            databaseURL: "https://complaint-bingo-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "complaint-bingo",
            storageBucket: "complaint-bingo.firebasestorage.app",
            messagingSenderId: "403581028557",
            appId: "1:403581028557:web:13058c895b707bf7814184"
        };

        // Initialize Firebase services
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        const auth = firebase.auth();

        // Check Authentication Status
        auth.onAuthStateChanged(user => {
            if (!user) {
                // If we had a login.html, we would redirect here.
                console.log("No user logged in.");
            } else {
                console.log("Welcome back, " + user.email);
            }
        });

        // Input Handling
        function handleInput() {
            const inputField = document.getElementById('site-input');
            const value = inputField.value.trim();
            
            if (value) {
                alert('Success: "' + value + '" received. Ready for Gemini 3 Flash processing!');
                inputField.value = '';
            }
        }

        // Listen for Enter key on input
        document.getElementById('site-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleInput();
        });

        function handleLogout() {
            auth.signOut().then(() => {
                alert("Logged out successfully.");
            });
        }
    </script>
</body>
</html>
